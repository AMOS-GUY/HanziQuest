# Production deploy: manual and owner-approved only (M10, M11). Never triggered by a push.
# Requires the same commit to have been deployed to staging successfully first.
# Before the first run, the owner creates the "production" GitHub environment with required
# reviewers and its own secrets (docs/DEPLOYMENT.md). GitHub creates an unprotected
# environment if a job names one that doesn't exist, so protect it BEFORE adding secrets.
name: Deploy production (manual)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA on main to deploy (CI green, already on staging)"
        required: true
        type: string
      confirm:
        description: 'Type "deploy production" to confirm'
        required: true
        type: string

permissions:
  contents: read
  checks: read
  deployments: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      sha: ${{ inputs.sha }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit
