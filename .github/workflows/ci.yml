name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hanziquest
          POSTGRES_PASSWORD: hanziquest
          POSTGRES_DB: hanziquest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hanziquest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hanziquest:hanziquest@localhost:5432/hanziquest
      TEST_DATABASE_URL: postgresql://hanziquest:hanziquest@localhost:5432/hanziquest_test
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the migration check can compare with the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Migration safety (no destructive statements; applied migrations unchanged)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            npm run db:check-migrations -- --base "origin/${{ github.base_ref }}"
          else
            npm run db:check-migrations
          fi

      - name: Generate ephemeral auth secret
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Validate curriculum content
        run: npm run content:validate

      - name: Unit tests
        run: npm test

      - name: Create test database
        run: PGPASSWORD=hanziquest psql -h localhost -U hanziquest -d hanziquest -c "CREATE DATABASE hanziquest_test"

      - name: Integration tests
        run: npm run test:integration

      - name: Migrate and seed
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Backup and restore drill
        run: |
          npm run db:backup -- --out backups/ci.ndjson.gz
          PGPASSWORD=hanziquest psql -h localhost -U hanziquest -d hanziquest -c "CREATE DATABASE hanziquest_restore"
          DATABASE_URL=postgresql://hanziquest:hanziquest@localhost:5432/hanziquest_restore npx prisma migrate deploy
          npm run db:restore -- --in backups/ci.ndjson.gz --target postgresql://hanziquest:hanziquest@localhost:5432/hanziquest_restore
          npm run db:verify -- --source "$DATABASE_URL" --target postgresql://hanziquest:hanziquest@localhost:5432/hanziquest_restore

      # M11: disposable-database drills. Migrations: fresh, upgrade, pending, failure and
      # recovery, environment marker, database down. Backups: restore, verify, six
      # corrupted or tampered cases rejected, and an age encryption round trip.
      - name: Migration and backup drills
        run: |
          sudo apt-get install -y -qq age >/dev/null
          npm run drill:migrations
          npm run drill:backup

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Firefox has never been run for this project (the development machine can't start it).
      # Advisory until its first green run on CI; then remove continue-on-error (INTEGRATION_AUDIT.md).
      - name: End-to-end tests (Firefox, advisory)
        id: firefox
        continue-on-error: true
        run: |
          npx playwright install --with-deps firefox
          E2E_ALL_BROWSERS=1 npx playwright test --project=firefox

      - name: Smoke test (production server)
        run: |
          AUTH_URL=http://localhost:3200 npx next start -p 3200 &
          for i in $(seq 1 30); do curl -sf http://localhost:3200/api/health && break; sleep 1; done
          npm run smoke -- http://localhost:3200

      - name: Upload Playwright report
        if: failure() || steps.firefox.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hanziquest
          POSTGRES_PASSWORD: hanziquest
          POSTGRES_DB: hanziquest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hanziquest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t hanziquest:ci .

      # M10-08: prove the image migrates, starts, answers both probes, runs as non-root and
      # stops cleanly on SIGTERM.
      - name: Start-up test (migrate, liveness, readiness, graceful stop)
        run: |
          DB=postgresql://hanziquest:hanziquest@localhost:5432/hanziquest
          docker run --rm --network host -e DATABASE_URL="$DB" hanziquest:ci \
            node node_modules/prisma/build/index.js migrate deploy
          secret=$(openssl rand -base64 32)
          docker run -d --name hq --network host \
            -e DATABASE_URL="$DB" -e AUTH_SECRET="$secret" -e AUTH_URL=http://localhost:3000 \
            -e AUTH_TRUST_HOST=true -e APP_RELEASE=ci-${GITHUB_SHA::7} hanziquest:ci
          for i in $(seq 1 40); do curl -sf http://localhost:3000/api/health/live >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/api/health/live | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://localhost:3000/api/health | tee /dev/stderr | grep -q '"migrations":"ok"'
          [ "$(docker exec hq id -u)" != "0" ] || { echo "::error::container runs as root"; exit 1; }
          start=$(date +%s); docker stop -t 20 hq >/dev/null; took=$(( $(date +%s) - start ))
          code=$(docker inspect hq --format '{{.State.ExitCode}}')
          echo "stopped in ${took}s, exit code $code"
          [ "$took" -lt 15 ] || { echo "::error::SIGTERM was not handled (took ${took}s)"; exit 1; }
          docker logs hq 2>&1 | tail -20
          docker rm hq >/dev/null

      - name: Refuses to start with a placeholder secret
        run: |
          set +e
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://hanziquest:hanziquest@localhost:5432/hanziquest \
            -e AUTH_SECRET=build-time-placeholder-secret-not-used-at-runtime \
            -e AUTH_URL=https://app.example.com -e AUTH_TRUST_HOST=true \
            hanziquest:ci timeout 25 node node_modules/next/dist/bin/next start -p 3001
          code=$?
          set -e
          # 124 = still running when the timeout hit; 0 = exited cleanly. Both mean it didn't refuse.
          if [ "$code" = 124 ] || [ "$code" = 0 ]; then
            echo "::error::the server didn't refuse a placeholder AUTH_SECRET (exit $code)"; exit 1
          fi
          echo "refused as expected (exit $code)"
