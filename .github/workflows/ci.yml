name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hanziquest
          POSTGRES_PASSWORD: hanziquest
          POSTGRES_DB: hanziquest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hanziquest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hanziquest:hanziquest@localhost:5432/hanziquest
      TEST_DATABASE_URL: postgresql://hanziquest:hanziquest@localhost:5432/hanziquest_test
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate ephemeral auth secret
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate curriculum content
        run: npm run content:validate

      - name: Unit tests
        run: npm test

      - name: Create test database
        run: PGPASSWORD=hanziquest psql -h localhost -U hanziquest -d hanziquest -c "CREATE DATABASE hanziquest_test"

      - name: Integration tests
        run: npm run test:integration

      - name: Migrate and seed
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
